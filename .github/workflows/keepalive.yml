name: Keep Render warm

# The Render free web service sleeps after ~15 minutes without traffic, and a
# cold start costs 30-60 s during which Telegram webhook deliveries fail.
# Pinging it every 14 minutes keeps it awake.
#
# The URL comes from a repository variable, not a hardcoded string: the actual
# Render hostname has a random suffix (e.g. product-background-bot-a1b2.onrender.com).
# Set it in Settings -> Secrets and variables -> Actions -> Variables -> RENDER_URL.
#
# Note: GitHub disables scheduled workflows after 60 days of repository
# inactivity. If the bot stops responding, check Actions -> this workflow.
on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the webhook service
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL variable is not set - nothing to ping."
            exit 0
          fi
          echo "Pinging $RENDER_URL"
          curl -s -o /dev/null -w "GET / -> %{http_code} in %{time_total}s\n" -A keepalive -m 60 "$RENDER_URL/" || true
          curl -s -o /dev/null -w "GET /health -> %{http_code} in %{time_total}s\n" -A keepalive -m 60 "$RENDER_URL/health" || true
