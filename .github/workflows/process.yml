name: Background replacement

# Triggered by the Render webhook via workflow_dispatch. The webhook never
# touches image bytes: it only forwards the Telegram file_id, so the free tier
# (512 MB / 0.1 CPU) is enough for it. All heavy work happens here, on a
# GitHub-hosted runner (2 vCPU / 7-8 GB RAM) which is free within the monthly
# private-repo minutes allowance.
on:
  workflow_dispatch:
    inputs:
      task:
        description: "replace = product onto background; clean = remove objects from a background"
        required: false
        default: 'replace'
      background_id:
        description: "Library id of the background (for task=clean)"
        required: false
        default: ''
      chat_id:
        description: 'Telegram chat to send the result to'
        required: true
        type: string
      file_id:
        description: 'Telegram file_id of the product photo'
        required: false
        default: ''
        type: string
      user_id:
        description: 'Telegram user id (for logging)'
        required: false
        type: string
        default: ''
      background:
        description: 'Repo-relative path of a library background'
        required: false
        type: string
        default: ''
      oneoff_file_id:
        description: 'Telegram file_id of a one-off background'
        required: false
        type: string
        default: ''
      model:
        description: 'rembg model name'
        required: false
        type: string
        default: 'isnet-general-use'
      size:
        description: 'Output edge length in pixels'
        required: false
        type: string
        default: '1024'
      label:
        description: 'Human-readable background name for the caption'
        required: false
        type: string
        default: ''

# One job per chat, queued rather than cancelled: dropping a run would silently
# lose the user's photo.
concurrency:
  group: background-${{ github.event.inputs.chat_id }}
  cancel-in-progress: false

# contents: write is needed for exactly one thing: after a successful delivery
# the worker clears the user's one-off background in settings.json.
permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-worker.txt

      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt

      # Models live in ~/.rembg/models. Caching avoids re-downloading 200-900 MB
      # on every single photo; without this a run costs minutes of extra time.
      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.rembg/models
          key: rembg-model-${{ github.event.inputs.model }}
          restore-keys: |
            rembg-model-

      # LaMa (object removal) lives apart from the rembg models so that it gets
      # its own fixed cache key: it never changes, so it is downloaded once.
      - name: Cache LaMa model
        if: github.event.inputs.task == 'clean'
        uses: actions/cache@v4
        with:
          path: ~/.lama
          key: lama-fp32-onnx-v1

      - name: Replace background
        env:
          LAMA_HOME: /home/runner/.lama
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          # 2 threads matches the runner's vCPU count; more threads on 2 cores
          # just adds contention.
          OMP_NUM_THREADS: '2'
          # Inputs go through the environment, never inline in the script:
          # ${{ }} is substituted into the shell text before it runs, so a
          # background named  Лето "у моря"  would break the command and a
          # name containing $(...) would execute on the runner.
          IN_TASK: ${{ github.event.inputs.task }}
          IN_BACKGROUND_ID: ${{ github.event.inputs.background_id }}
          IN_CHAT_ID: ${{ github.event.inputs.chat_id }}
          IN_USER_ID: ${{ github.event.inputs.user_id }}
          IN_FILE_ID: ${{ github.event.inputs.file_id }}
          IN_BACKGROUND: ${{ github.event.inputs.background }}
          IN_ONEOFF_FILE_ID: ${{ github.event.inputs.oneoff_file_id }}
          IN_MODEL: ${{ github.event.inputs.model }}
          IN_SIZE: ${{ github.event.inputs.size }}
          IN_LABEL: ${{ github.event.inputs.label }}
        run: |
          python worker.py \
            --task "${IN_TASK:-replace}" \
            --background-id "$IN_BACKGROUND_ID" \
            --chat-id "$IN_CHAT_ID" \
            --user-id "$IN_USER_ID" \
            --file-id "$IN_FILE_ID" \
            --background "$IN_BACKGROUND" \
            --oneoff-file-id "$IN_ONEOFF_FILE_ID" \
            --model "$IN_MODEL" \
            --size "$IN_SIZE" \
            --label "$IN_LABEL"

      # worker.py already reports expected failures to the user, so this only
      # fires on infrastructure problems (bad secret, runner out of minutes...).
      - name: Report infrastructure failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          IN_CHAT_ID: ${{ github.event.inputs.chat_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          from common import telegram_api as tg
          chat_id = os.environ["IN_CHAT_ID"]
          run_url = os.environ["RUN_URL"]
          try:
              tg.send_message(chat_id, f"⚠️ Обработка упала на уровне инфраструктуры.\nЛоги: {run_url}")
          except Exception as exc:
              print("could not notify:", exc)
          PY
